# Google Pixelbook Go (Atlas) Chromebook action-row mapping for keyd.
# The firmware exposes the top row as F1-F10 on Linux. Translate the
# legends back to the corresponding Linux media/browser key events.

[ids]
*

[main]
# Chromebook Search/Launcher position (below Tab) -> F24 voice toggle.
# This direct mapping is the known-good Atlas path; combination behavior is
# intentionally left unchanged until the standalone voice path is verified.
capslock = f24
# The physical Assistant key between Ctrl and Alt already emits Win/Super.
# Keep left Ctrl and left Alt unchanged.
f1 = back
f2 = refresh
f5 = brightnessdown
f6 = brightnessup
f7 = playpause
f8 = mute
f9 = volumedown
f10 = volumeup
