# Google Pixelbook Go (Atlas) Chromebook action-row mapping for keyd.
# The firmware exposes the top row as F1-F10 on Linux. Translate the
# legends back to the corresponding Linux media/browser key events.

[ids]
*

[main]
# Chromebook Search/Launcher position (below Tab) -> normal Caps Lock.
capslock = capslock
# Physical left Ctrl (immediately left of Alt) -> Win/Super.
leftcontrol = leftmeta
f1 = back
f2 = refresh
f5 = brightnessdown
f6 = brightnessup
f7 = playpause
f8 = mute
f9 = volumedown
f10 = volumeup
